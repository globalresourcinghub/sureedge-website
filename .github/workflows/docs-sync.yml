name: docs-sync

# Verifies documentation stays in sync with code. This is a CHECK ONLY — it never
# deploys. Mirrors the local .githooks/pre-push gate so pushes from any machine are caught.

on:
  push:
    branches-ignore: []
  pull_request:

jobs:
  docs-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so range diffs work

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compute commit range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            # New-branch pushes report an all-zero "before" — fall back to main's merge-base.
            if [ -z "$BASE" ] || echo "$BASE" | grep -qE '^0+$'; then
              git fetch origin main --depth=0 2>/dev/null || true
              BASE="$(git merge-base origin/main "$HEAD" 2>/dev/null || echo "")"
            fi
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"

      - name: docs-check (mechanical facts)
        run: node scripts/docs-check.mjs

      - name: docs-gate (significance vs docs)
        run: node scripts/docs-gate.mjs --base "${{ steps.range.outputs.base }}" --head "${{ steps.range.outputs.head }}"
